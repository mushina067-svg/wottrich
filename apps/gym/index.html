<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wottrich Gym — Rutinas</title>
<style>
:root{--bg:#0d1f35;--card:#fff;--ink:#0d1f35;--mut:#5b6b80;--acc:#1a9e4a;--line:#d9e1ea;--soft:#f3f6f9;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--soft);color:var(--ink)}
header{background:var(--bg);color:#fff;padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:20px}header small{opacity:.75}
main{max-width:1200px;margin:auto;padding:14px;display:grid;gap:14px;grid-template-columns:320px 1fr}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
h2{font-size:15px;margin:0 0 8px}
input,select,textarea{font:inherit;padding:7px 8px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
label{font-size:11px;color:var(--mut);display:block;margin-bottom:2px}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}button.on{background:var(--bg);color:#fff}
button.del{color:var(--red)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips button{font-size:12px;padding:4px 8px}
#lib{max-height:60vh;overflow:auto;margin-top:8px}
.ex{width:100%;text-align:left;margin-bottom:4px;font-size:13px}.ex small{display:block;color:var(--mut);font-size:11px}
.item{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
.item .f{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
@media(max-width:700px){.item .f{grid-template-columns:repeat(3,1fr)}}
.tag{font-size:10px;background:var(--soft);border-radius:6px;padding:2px 6px;color:var(--mut)}
.calc{font-size:12px;color:var(--acc);font-weight:600}
#print{display:none}
@media print{*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}header,main{display:none!important}#print{display:block}body{background:#fff}
#print table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px}
#print th,#print td{border:1px solid #ccc;padding:4px;text-align:left}#print th{background:#0d1f35;color:#fff}
#print h3{margin:12px 0 4px;color:#0d1f35;page-break-after:avoid}}
</style>
</head>
<body>
<header>
  <div><h1>Wottrich Gym</h1><small>Planificador de rutinas de fuerza y pliometría</small></div>
  <div class="row">
    <button onclick="nueva()">Nueva</button>
    <button onclick="exportar()">Guardar archivo</button>
    <label style="margin:0"><span class="row" style="border:1px solid #fff4;border-radius:8px;padding:7px 10px;color:#fff;cursor:pointer">Abrir archivo</span><input type="file" accept=".json" hidden onchange="importar(this.files[0]);this.value=''"></label>
    <button class="pri" onclick="imprimir()">Imprimir / PDF</button>
  </div>
</header>
<main>
  <aside class="card">
    <h2>Biblioteca de ejercicios</h2>
    <input id="q" placeholder="Buscar…" oninput="renderLib()">
    <div class="chips row" id="cats" style="margin-top:6px"></div>
    <div id="lib"></div>
    <details style="margin-top:8px"><summary style="font-size:13px;cursor:pointer">+ Ejercicio propio</summary>
      <input id="cuNom" placeholder="Nombre" style="margin-top:6px"><select id="cuCat" style="margin-top:6px"></select>
      <button class="pri" style="margin-top:6px;width:100%" onclick="addCustom()">Agregar a la biblioteca</button></details>
  </aside>
  <section style="display:grid;gap:14px">
    <div class="card grid3">
      <div><label>Nombre de la rutina</label><input id="rNom" oninput="R.nombre=this.value;save()"></div>
      <div><label>Deportista</label><input id="rAtl" oninput="R.atleta=this.value;save()"></div>
      <div><label>Edad</label><input id="rEdad" type="number" min="5" max="99" oninput="R.edad=this.value;save()"></div>
      <div><label>Entrenador</label><input id="rEnt" oninput="R.entrenador=this.value;save()"></div>
    </div>
    <div class="card">
      <h2>Días de la semana</h2>
      <div class="row" id="dias"></div>
    </div>
    <div class="card" id="dia"></div>
    <div class="card">
      <h2>RM del deportista (kg)</h2>
      <p style="font-size:12px;color:var(--mut);margin:0 0 8px">Cargá el RM de cada ejercicio usado. Si en un ejercicio ponés % de RM, el peso se calcula solo.</p>
      <div id="rms" class="grid3"></div>
    </div>
  </section>
</main>
<div id="print"></div>
<script>
const DIAS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const CATS=["Pecho","Espalda","Hombros","Brazos","Piernas","Cadena posterior","Olímpicos","Core","Pliometría inferior","Pliometría superior","Movilidad"];
const L=(c,a)=>a.split("|").map(n=>({c,n}));
const BASE=[
...L("Pecho","Press de banca|Press inclinado con barra|Press declinado|Press con mancuernas|Press inclinado con mancuernas|Aperturas con mancuernas|Cruce de poleas|Fondos en paralelas|Fondos lastrados|Flexiones de brazos|Press en máquina|Pec deck"),
...L("Espalda","Dominadas|Dominadas lastradas|Dominadas supinas|Jalón al pecho|Jalón agarre estrecho|Remo con barra|Remo Pendlay|Remo con mancuerna|Remo en polea baja|Remo en máquina|Remo invertido|Pullover en polea|Pullover con mancuerna|Face pull|Encogimientos"),
...L("Hombros","Press militar de pie|Press militar sentado|Press con mancuernas|Press Arnold|Elevaciones laterales|Elevaciones frontales|Pájaros (posterior)|Remo al mentón|Landmine press"),
...L("Brazos","Curl con barra|Curl con mancuernas|Curl martillo|Curl predicador|Curl en polea|Press francés|Extensión de tríceps en polea|Extensión sobre la cabeza|Press cerrado|Patada de tríceps"),
...L("Piernas","Sentadilla con barra|Sentadilla frontal|Sentadilla goblet|Sentadilla búlgara|Sentadilla hack|Prensa de piernas|Zancadas|Zancadas caminando|Step up|Extensión de cuádriceps|Sentadilla a una pierna (pistol)|Elevación de talones de pie|Elevación de talones sentado"),
...L("Cadena posterior","Peso muerto|Peso muerto sumo|Peso muerto rumano|Peso muerto con mancuernas|Peso muerto a una pierna|Hip thrust|Puente de glúteo|Buenos días|Curl femoral acostado|Curl femoral sentado|Nordic curl|Hiperextensiones|Kettlebell swing"),
...L("Olímpicos","Snatch (arranque)|Power snatch|Hang snatch|Clean (cargada)|Power clean|Hang clean|Clean and jerk|Push press|Push jerk|Split jerk|Clean pull|Snatch pull"),
...L("Core","Plancha|Plancha lateral|Crunch|Crunch en polea|Elevación de piernas colgado|Rueda abdominal|Dead bug|Bird dog|Press Pallof|Russian twist|Dragon flag|Hollow hold|Leñador en polea|Farmer walk"),
...L("Pliometría inferior","Spring corto|Saltos al cajón|Saltos en profundidad (drop jump)|Saltos con contramovimiento (CMJ)|Squat jump|Saltos de vallas|Saltos de longitud sin carrera|Triple salto horizontal|Saltos tuck (rodillas al pecho)|Saltos a una pierna|Bounding (saltos alternos)|Saltos laterales|Saltos laterales sobre valla|Skipping|Saltos de tijera (split jump)|Pogo jumps|Saltos con trap bar|Saltos con chaleco lastrado|Broad jump repetido"),
...L("Pliometría superior","Flexiones pliométricas|Flexiones con palmada|Flexiones en profundidad (drop push-up)|Lanzamiento de balón medicinal al pecho|Lanzamiento por encima de la cabeza|Slam de balón medicinal|Lanzamiento rotacional a la pared|Lanzamiento de balón medicinal hacia atrás|Lanzamiento a una mano|Press de banca balístico|Dominadas explosivas|Battle ropes"),
...L("Movilidad","Movilidad de cadera|Movilidad torácica|Movilidad de hombro con banda|Estiramiento de isquios|Rotaciones con banda")
];
let CUSTOM=JSON.parse(localStorage.getItem("wgym-custom")||"[]");
const LIB=()=>BASE.concat(CUSTOM);
let cat="Todos",diaSel=0;
const nuevaR=()=>({nombre:"Rutina de fuerza",atleta:"",edad:"",entrenador:"",fecha:"",descEj:120,rm:{},dias:DIAS.map(d=>({nombre:d,activo:false,foco:"",items:[]}))});
let R;try{R=JSON.parse(localStorage.getItem("wgym-rutina"))||nuevaR()}catch(e){R=nuevaR()}
R.dias.forEach(d=>d.items.forEach(it=>{if(!it.rModo)it.rModo="reps"}));
const save=()=>localStorage.setItem("wgym-rutina",JSON.stringify(R));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const catOf=n=>(LIB().find(e=>e.n===n)||{}).c||"";
const isPlio=n=>catOf(n).startsWith("Pliometría");
const r1=x=>Math.round(x*10)/10;
function pesoDe(it){if(it.modo==="pc")return 0;if(it.modo==="rm"){const rm=+R.rm[it.ej]||0;return rm?Math.round(rm*it.pct/100/2.5)*2.5:0}return +it.peso||0}
const fmtT=s=>{s=+s||0;return s>=60?Math.floor(s/60)+"′"+(s%60?String(s%60).padStart(2,"0")+"″":""):s+"″"};

function renderCats(){document.getElementById("cats").innerHTML=["Todos",...CATS].map(c=>`<button class="${c===cat?"on":""}" onclick="cat='${c}';renderCats();renderLib()">${c}</button>`).join("");
document.getElementById("cuCat").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("")}
function renderLib(){const q=document.getElementById("q").value.trim().toLowerCase();
const l=LIB().filter(e=>(cat==="Todos"||e.c===cat)&&e.n.toLowerCase().includes(q));
document.getElementById("lib").innerHTML=l.map(e=>`<button class="ex" onclick='add(${JSON.stringify(e.n)})'>${esc(e.n)}<small>${e.c}</small></button>`).join("")||"<small>Sin resultados</small>"}
function addCustom(){const n=document.getElementById("cuNom").value.trim();if(!n)return;CUSTOM.push({c:document.getElementById("cuCat").value,n});localStorage.setItem("wgym-custom",JSON.stringify(CUSTOM));document.getElementById("cuNom").value="";renderLib()}
function add(n){const d=R.dias[diaSel];d.activo=true;const p=isPlio(n);
d.items.push({ej:n,series:p?3:4,reps:p?20:8,rModo:p?"seg":"reps",modo:p?"pc":"kg",peso:0,pct:75,dS:p?60:90,dE:R.descEj,nota:""});save();render()}

function renderDias(){document.getElementById("dias").innerHTML=R.dias.map((d,i)=>`<button class="${i===diaSel?"on":""}" onclick="diaSel=${i};render()">${d.nombre}${d.items.length?" ("+d.items.length+")":d.activo?"":" · descanso"}</button>`).join("")}
function renderDia(){const d=R.dias[diaSel];let ton=0,ser=0,tiempo=0;
const items=d.items.map((it,k)=>{const p=pesoDe(it);if(it.rModo!=="seg")ton+=it.series*(+it.reps||0)*p;ser+=+it.series;tiempo+=(it.series-1)*it.dS+(k<d.items.length-1?+it.dE:0);
return `<div class="item"><div class="row"><b style="font-size:14px">${k+1}. ${esc(it.ej)}</b><span class="tag">${catOf(it.ej)}</span>
<span class="calc">${it.modo==="pc"?"Peso corporal":p?`Peso: ${p} kg`:""}${it.modo==="rm"&&!R.rm[it.ej]?"Cargá el RM abajo":""}</span>
<span style="margin-left:auto" class="row"><button onclick="mv(${k},-1)">↑</button><button onclick="mv(${k},1)">↓</button><button onclick="dup(${k})">⧉</button><button class="del" onclick="del(${k})">✕</button></span></div>
<div class="f">
<div><label>Series</label><input type="number" min="1" value="${it.series}" oninput="ed(${k},'series',+this.value)"></div>
<div><label>Reps / Seg.</label><div class="row" style="gap:4px;flex-wrap:nowrap"><input value="${esc(it.reps)}" oninput="ed(${k},'reps',this.value)"><select style="width:66px;flex:none" onchange="ed(${k},'rModo',this.value,1)"><option value="reps" ${it.rModo!=="seg"?"selected":""}>Reps</option><option value="seg" ${it.rModo==="seg"?"selected":""}>Seg.</option></select></div></div>
<div><label>Carga por</label><select onchange="ed(${k},'modo',this.value,1)"><option value="kg" ${it.modo==="kg"?"selected":""}>Peso (kg)</option><option value="rm" ${it.modo==="rm"?"selected":""}>% de RM</option><option value="pc" ${it.modo==="pc"?"selected":""}>Peso corporal</option></select></div>
${it.modo==="rm"?`<div><label>% RM</label><input type="number" min="0" max="120" step="2.5" value="${it.pct}" oninput="ed(${k},'pct',+this.value,1)"></div>`:it.modo==="pc"?`<div><label>Peso</label><input disabled value="Corporal"></div>`:`<div><label>Peso (kg)</label><input type="number" min="0" step="2.5" value="${it.peso}" oninput="ed(${k},'peso',+this.value,1)"></div>`}
<div><label>Descanso entre series (s)</label><input type="number" min="0" step="15" value="${it.dS}" oninput="ed(${k},'dS',+this.value)"></div>
<div><label>Descanso al siguiente ejercicio (s)</label><input type="number" min="0" step="15" value="${it.dE}" oninput="ed(${k},'dE',+this.value)"></div>
<div><label>Nota</label><input value="${esc(it.nota)}" placeholder="tempo, altura…" oninput="ed(${k},'nota',this.value)"></div>
</div></div>`}).join("");
document.getElementById("dia").innerHTML=`<div class="row" style="margin-bottom:8px"><h2 style="margin:0">${d.nombre}</h2>
<input style="max-width:260px" placeholder="Foco del día (ej. Tren inferior + pliometría)" value="${esc(d.foco)}" oninput="R.dias[${diaSel}].foco=this.value;save()">
<label class="row" style="margin:0;font-size:13px;color:var(--ink)"><input type="checkbox" style="width:auto" ${d.activo?"checked":""} onchange="R.dias[${diaSel}].activo=this.checked;save();renderDias()"> Día de entrenamiento</label>
<span style="margin-left:auto;font-size:12px;color:var(--mut)">${ser} series · ${Math.round(ton)} kg de tonelaje · ~${Math.round(tiempo/60)} min de descanso</span></div>
${items||'<p style="font-size:13px;color:var(--mut)">Elegí ejercicios de la biblioteca para este día.</p>'}
${d.items.length?`<div class="row"><select id="copyTo">${DIAS.map((n,i)=>i!==diaSel?`<option value="${i}">${n}</option>`:"").join("")}</select><button onclick="copiar()">Copiar día a…</button><button class="del" onclick="if(confirm('¿Vaciar día?')){R.dias[diaSel].items=[];save();render()}">Vaciar día</button></div>`:""}`}
function renderRM(){const used=[...new Set(R.dias.flatMap(d=>d.items.filter(i=>!isPlio(i.ej)&&i.modo!=="pc").map(i=>i.ej)))];
document.getElementById("rms").innerHTML=used.map(n=>`<div><label>${esc(n)}</label><input type="number" min="0" step="2.5" value="${R.rm[n]||""}" onchange='R.rm[${JSON.stringify(n)}]=+this.value||0;save();renderDia()'></div>`).join("")||'<small style="color:var(--mut)">Aparecerán los ejercicios de la rutina.</small>'}
function ed(k,f,v,re){R.dias[diaSel].items[k][f]=v;save();if(re)renderDia()}
function mv(k,d){const a=R.dias[diaSel].items,t=k+d;if(t<0||t>=a.length)return;[a[k],a[t]]=[a[t],a[k]];save();renderDia()}
function dup(k){const a=R.dias[diaSel].items;a.splice(k+1,0,{...a[k]});save();render()}
function del(k){R.dias[diaSel].items.splice(k,1);save();render()}
function copiar(){const t=+document.getElementById("copyTo").value;R.dias[t].items=R.dias[diaSel].items.map(i=>({...i}));R.dias[t].activo=true;R.dias[t].foco=R.dias[diaSel].foco;save();renderDias()}
function render(){["rNom:nombre","rAtl:atleta","rEdad:edad","rEnt:entrenador"].forEach(s=>{const[id,k]=s.split(":");const el=document.getElementById(id);if(document.activeElement!==el)el.value=R[k]??""});renderDias();renderDia();renderRM()}
function nueva(){if(confirm("¿Empezar una rutina nueva? Guardá antes la actual si la necesitás.")){R=nuevaR();diaSel=0;save();render()}}
function exportar(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(R,null,2)],{type:"application/json"}));a.download=(R.nombre||"rutina").replace(/\s+/g,"-").toLowerCase()+".json";a.click()}
function importar(f){if(!f)return;const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(d&&Array.isArray(d.dias)){R={...nuevaR(),...d};diaSel=0;save();render()}}catch(e){alert("Archivo inválido")}};fr.readAsText(f)}
